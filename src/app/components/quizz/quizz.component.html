<div class="quizz__container">
  <div class="quizz_logo">
    <img src="assets/imgs/logo.png" alt="Logo do quizz" />
    <h3>{{ title }}</h3>
  </div>

  <ng-container *ngIf="!finished; else results">
    <div class="quizz_progress">
      <div class="quizz_progress-bar" [style.width.%]="progress"></div>
    </div>
    <p class="quizz_counter">
      Pergunta {{ questionIndex + 1 }} de {{ questionMaxIndex }}
    </p>

    <div class="quizz_questions">
      <h3>{{ questionSelected.question }}</h3>
    </div>

    <div class="quizz_options">
      <button
        *ngFor="let option of questionSelected.options"
        (click)="playerChoose(option.alias)"
        type="button"
        class="btn-option"
      >
        {{ option.name }}
      </button>
    </div>
  </ng-container>

  <ng-template #results>
    <div class="quizz_results">
      <h1>O seu resultado é:</h1>
      <p>{{ answerSelected }}</p>
      <button (click)="start()" type="button" class="btn-restart">
        Refazer o quizz
      </button>
    </div>
  </ng-template>
</div>
